# Best detector recipe: YOLO11s at the frames' native 1920 px width.
# Needs a ~16 GB GPU (trained on a free Google Colab T4). From the repo root:
#   yolo detect train cfg=configs/train_yolo11s_1920.yaml project=<absolute path>/outputs
# The 960 and 1280 runs' exact settings are in outputs/*/args.yaml.

task: detect
mode: train

model: yolo11s.pt
data: data/processed/pix2pockets_v3/data.yaml

imgsz: 1920
batch: 4
nbs: 4  # keep equal to batch; a smaller nbs scales weight decay up
epochs: 100
patience: 20

device: 0
workers: 2
cache: ram
amp: true
seed: 42
deterministic: true

optimizer: auto
pretrained: true

# Preserve the single-table scene: only horizontal flips and mild broadcast-lighting
# variation.
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
cutmix: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.4
hsv_v: 0.3

val: true
plots: true
save: true
save_period: -1
project: outputs
name: yolo11s-1920
exist_ok: false
